<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}IT Equipment SMS{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background-color: #f4f5f7; color: #1f2937; }
        nav {
            background-color: #1f2733;
            display: flex;
            align-items: center;
            padding: 0 24px;
            height: 50px;
        }
        nav a {
            color: #d1d5db;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            padding: 0 16px;
            height: 50px;
            display: flex;
            align-items: center;
        }
        nav a:first-child { padding-left: 0; margin-right: 8px; color: #ffffff; font-weight: 600; }
        nav a:hover { color: #ffffff; }
        nav a.active { color: #ffffff; border-bottom: 2px solid #3b82f6; }
        .page-wrap { max-width: 1200px; margin: 0 auto; padding: 32px 24px; }
        .page-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 20px; }
        .card { background: #fff; border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'dashboard:dashboard_home' %}">IT Eqp SMS</a>
        <a href="{% url 'dashboard:dashboard_home' %}">Dashboard</a>
        <a href="{% url 'vendors:vendor_list' %}">Vendor</a>
        <a href="{% url 'vendors:contact_list' %}">Contact</a>
        <a href="{% url 'vendors:performance_list' %}">Performance</a>
        <a href="{% url 'vendors:issue_list' %}">Issue</a>
        <a href="{% url 'vendors:escalation_list' %}">Escalation</a>
            <a href="{% url 'it_assets:dashboard' %}" style="margin-left:auto; color:#93c5fd;">&larr; IT Assets App</a>
    </nav>
    <div class="page-wrap">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
