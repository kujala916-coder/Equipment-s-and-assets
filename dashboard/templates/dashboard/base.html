<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Dashboard{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f5f7;
            color: #1f2937;
        }
        nav {
            background-color: #1f2733;
            display: flex;
            align-items: center;
            padding: 0 24px;
            height: 50px;
        }
        nav a {
            color: #d1d5db;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            padding: 0 16px;
            height: 50px;
            display: flex;
            align-items: center;
        }
        nav a:first-child { padding-left: 0; margin-right: 8px; color: #ffffff; font-weight: 600; }
        nav a:hover { color: #ffffff; }
        nav a.active { color: #ffffff; border-bottom: 2px solid #3b82f6; }
        .page-wrap { max-width: 1200px; margin: 0 auto; padding: 32px 24px; }
        .page-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 20px; }
        .stat-strip {
            background: #ffffff;
            border-radius: 8px;
            display: flex;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            overflow: hidden;
            margin-bottom: 24px;
        }
        .stat-box {
         flex: 1;
         padding: 40px 32px;
         border-right: 1px solid #eef0f2;
}
        .stat-box:last-child { border-right: none; }
        .stat-number { font-size: 2.6rem; font-weight: 700; line-height: 1; }
        .stat-label { color: #6b7280; font-size: 0.95rem; margin-top: 10px; }
        .panel {
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            padding: 24px;
        }
        .panel h3 { font-size: 1.05rem; font-weight: 600; margin-bottom: 16px; }
        .link-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f0f1f3;
        }
        .link-row:last-child { border-bottom: none; }
        .link-row a { color: #1f2937; text-decoration: none; font-size: 0.95rem; }
        .link-row a:hover { color: #2563eb; }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'dashboard:dashboard_home' %}">IT Eqp SMS</a>
        <a href="{% url 'dashboard:dashboard_home' %}" class="active">Dashboard</a>
        <a href="{% url 'vendors:vendor_list' %}">Vendors</a>
        <a href="{% url 'procurement:procurement_list' %}">Procurement</a>
        <a href="{% url 'contracts:contract_list' %}">Contracts</a>
        <a href="{% url 'it_assets:dashboard' %}" style="margin-left:auto; color:#93c5fd;">&larr; IT Assets App</a>
    </nav>
    <div class="page-wrap">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
